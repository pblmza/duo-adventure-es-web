<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sword World 2.5 · Duo Adventure (ES)</title>
<style>
:root{
  --paper:#f6efe1; --paper2:#efe4cf; --ink:#2b2219; --muted:#7a6a58; --line:#d9c8a8;
  --accent:#b5532f; --accent2:#8a3b1f; --gold:#b8913a; --sun:#d08a12; --moon:#4a62a8;
  --ok:#2f7a3b; --ko:#b02a2a; --card:#fbf6ec;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6}
body{background-image:radial-gradient(ellipse at top,#fbf6ea 0,#f3ead8 60%,#ece0c8 100%);background-attachment:fixed;min-height:100vh}
a{color:var(--accent2)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:.45rem .9rem;background:rgba(43,34,25,.95);color:#f3e7cf;font-family:var(--sans);font-size:14px;flex-wrap:wrap}
header.top .brand{font-family:var(--serif);font-weight:700;letter-spacing:.02em;margin-right:.6rem;cursor:pointer}
header.top .brand small{color:var(--gold);font-weight:400}
.nav{display:flex;gap:.2rem;flex-wrap:wrap}
.nav button,#sideToggle{background:none;border:1px solid transparent;color:#e9dcc2;padding:.3rem .6rem;border-radius:6px;font:inherit;cursor:pointer}
.nav button.on{border-color:var(--gold);color:#fff}
#sideToggle{margin-left:auto;border-color:#6b5a45}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1.2rem;max-width:1220px;margin:0 auto;padding:1rem}
body[data-view=start] .layout{grid-template-columns:1fr} body[data-view=start] #side{display:none}
#main{min-width:0}
#side{position:sticky;top:3.2rem;align-self:start;max-height:calc(100vh - 4rem);overflow:auto;font-family:var(--sans);font-size:13.5px;line-height:1.4}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  #side{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);max-height:none;background:var(--paper);box-shadow:-6px 0 24px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .25s;z-index:30;padding:1rem;padding-top:3.5rem}
  body.side-open #side{transform:none}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;margin:1rem 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.btn{font-family:var(--sans);font-size:14px;background:#fffaf0;border:1px solid var(--line);color:var(--ink);padding:.45rem .8rem;border-radius:8px;cursor:pointer;margin:.15rem;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:transparent}
.btn.sm{font-size:12.5px;padding:.25rem .55rem}
.btn.big{font-size:16px;padding:.7rem 1.2rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{font-family:var(--sans);border:1px solid var(--line);background:#fff;border-radius:5px;width:22px;height:22px;padding:0;cursor:pointer;line-height:1}
.muted{color:var(--muted)} .small,.sm{font-size:.85em}
.row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:.5rem}
.tg{display:block;font-family:var(--sans);font-size:14px;margin:.3rem 0;cursor:pointer}
.tg.sub{margin-left:1.4rem;font-size:13px;color:var(--muted)}
/* inicio */
.start{max-width:760px;margin:0 auto;text-align:center}
.start .cover{max-width:340px;width:70%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);margin:1rem auto}
.start h1{font-size:2.4rem;margin:.4rem 0;line-height:1.1}.start h1 small{display:block;font-size:1.3rem;color:var(--accent)}
.subtitle{font-style:italic;color:var(--muted)}
.start .newgame{text-align:left;max-width:520px;margin:1.2rem auto}
/* nodo */
.node{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.8rem 1.6rem;box-shadow:0 6px 24px rgba(80,50,20,.08)}
.hdr{text-align:center;border-bottom:1px solid var(--line);padding-bottom:.6rem;margin-bottom:.4rem}
.hdr .top{font-variant:small-caps;letter-spacing:.08em;color:var(--accent2);font-weight:700}
.hdr .sub{font-style:italic;color:var(--muted)}
.pcode{text-align:center;font-size:2.4rem;font-weight:700;color:var(--accent);margin:.2rem 0 .6rem;letter-spacing:.05em;text-shadow:0 1px 0 #fff}
.pcode::before,.pcode::after{content:"❦";font-size:1rem;color:var(--gold);vertical-align:middle;margin:0 .8rem}
.node p{margin:.65rem 0;text-indent:1.2em;text-align:justify;hyphens:auto}
figure{margin:1rem 0;text-align:center}figure img{max-width:100%;max-height:520px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.tag{color:var(--accent2);font-weight:600}
.item{color:#6a4b12;font-weight:600}
.sun{color:var(--sun)}.moon{color:var(--moon)}
.q{color:#3d2f22}
.choices{margin-top:1.2rem;display:flex;flex-direction:column;gap:.45rem}
.choice{text-align:left;font-family:var(--serif);font-size:17px;background:#fff8ea;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:.6rem .9rem;cursor:pointer;color:var(--ink)}
.choice:hover{background:#fff1d9}
.choice small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:.15rem}
.choice.dis{opacity:.45;border-left-color:#999}
.the-end{text-align:center;font-size:1.6rem;letter-spacing:.3em;color:var(--accent);margin:2rem 0}
.navrow{margin-top:1.2rem;text-align:center}
.combat-cta{margin:1.2rem 0;text-align:center;padding:1rem;border:2px dashed var(--accent);border-radius:12px;background:#fff4e6}
/* pruebas y efectos */
.check{font-family:var(--sans);font-size:14px;background:#f4ecdc;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0}
.check .ch{font-weight:700;display:flex;justify-content:space-between;align-items:center}
.crow{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;padding:.25rem 0;border-top:1px dotted var(--line)}
.crow .who{min-width:7.5rem}
.crow .mod{width:3.2rem;font:inherit;padding:.15rem;border:1px solid var(--line);border-radius:5px}
.csum{margin-top:.3rem;font-style:italic;color:var(--accent2)}
.dice{font-size:1.35em;letter-spacing:.05em;vertical-align:-2px}
.ok{color:var(--ok);font-weight:700}.ko{color:var(--ko);font-weight:700}.okd{color:var(--accent2)}
.crit{color:var(--gold);font-weight:700}
.fx{margin:.4rem 0;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.fxchip{font-family:var(--sans);font-size:13px;border:1px solid var(--gold);background:#fff7e0;color:#5b4310;border-radius:20px;padding:.25rem .7rem;cursor:pointer}
.fxchip.done{opacity:.55;border-style:dashed}
.blockstart{justify-content:center;margin-bottom:.6rem}
/* lateral */
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem;margin-bottom:.7rem}
.pc.dead{opacity:.55}.pc.passive{background:#f3ece0}
.pn{display:flex;gap:.6rem;align-items:center;margin-bottom:.4rem}
.pn .av{flex:none;border-radius:50%;border:2px solid var(--gold);background-repeat:no-repeat;background-color:#ddd}
.adj{display:flex;gap:.25rem;align-items:center;margin:.2rem 0}.adj .bar{flex:1}
.bar{position:relative;height:18px;background:#e8dcc4;border-radius:9px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c0533a,#d9774c)}
.bar.mp i{background:linear-gradient(90deg,#4a62a8,#6c86c9)}
.bar span{position:relative;font-size:11.5px;font-weight:700;padding-left:.5rem;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.sup{margin:.3rem 0;font-size:14px}.sup b{font-size:17px;color:var(--accent2)}
.inv{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;background:#efe2c6;border-radius:10px;padding:0 .45rem;margin:0 .1rem;font-size:12px}
.sts{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.35rem}
.stt{font-size:11.5px;border:1px solid var(--line);border-radius:12px;padding:.05rem .45rem;cursor:pointer;background:#fff}
.stt input{display:none}.stt.on{background:var(--accent);color:#fff;border-color:var(--accent2)}
.counters,.dicebox,.keyitems{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;margin-bottom:.7rem}
h4{margin:.1rem 0 .4rem;font-family:var(--serif);color:var(--accent2)}
.cnt{display:flex;gap:.3rem;align-items:center;margin:.2rem 0}.cnt b{margin-left:auto;margin-right:.3rem}
textarea{width:100%;min-height:90px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:.4rem;background:#fffdf7}
/* manual */
.manual h1{color:var(--accent2);border-bottom:2px solid var(--gold);padding-bottom:.2rem}
.manual h2,.manual h3{color:var(--accent2);margin-top:1.4rem}
.manual h4{font-size:1.05rem}
.manual table{border-collapse:collapse;margin:.6rem 0;font-family:var(--sans);font-size:13.5px;width:100%;overflow-x:auto;display:block}
.manual th,.manual td{border:1px solid var(--line);padding:.25rem .45rem;text-align:left}
.manual th{background:#efe2c6}
.toc{font-family:var(--sans);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin-bottom:1rem;columns:2}
.toc a{display:block;text-decoration:none}.toc a.l4{padding-left:1rem;color:var(--muted)}
@media (max-width:700px){.toc{columns:1}}
.mon h3 .lvl{display:inline-block;background:var(--ink);color:#fff;border-radius:4px;padding:0 .4rem;margin-right:.3rem}
.sheet .sh-top{display:flex;gap:1rem;align-items:flex-start}.sheet .sh-top img{width:120px;border-radius:8px;border:2px solid var(--gold)}
.hist{line-height:2}.jl{border-bottom:1px dotted var(--line);padding:.15rem 0;font-family:var(--sans);font-size:13.5px}
/* combate */
#combat{position:fixed;inset:0;z-index:40;background:rgba(30,22,14,.94);display:none;overflow:auto;font-family:var(--sans);color:var(--ink)}
#combat.open{display:block}
.cb-setup{max-width:720px;margin:2rem auto;background:var(--card);border-radius:14px;padding:1.2rem 1.5rem}
.cb-setup h2{font-family:var(--serif);color:var(--accent2);margin-top:0}
.cb-wrap{max-width:1300px;margin:0 auto;padding:.8rem;display:flex;flex-direction:column;gap:.7rem;min-height:100vh}
.cb-head{display:flex;align-items:center;gap:1rem;color:#f3e7cf}.cb-head h2{margin:0;font-family:var(--serif)}.cb-head span{color:var(--gold);margin-left:auto}
.cb-field{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.area{background:#efe5d1;border-radius:12px;padding:.5rem;min-height:170px;border:2px solid transparent}
.area.skirmish{border-color:var(--accent);background:#f5dfcf}
.area .an{font-weight:700;font-size:13px;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
.unit{background:#fff;border-radius:10px;padding:.45rem .55rem;margin-bottom:.45rem;border:1px solid var(--line);font-size:13px}
.unit.pc{border-left:5px solid var(--gold)}.unit.en{border-left:5px solid #6d2a1a}
.unit.active{box-shadow:0 0 0 3px var(--accent)}
.unit.acted{opacity:.75}
.unit.dead,.unit.fled{opacity:.4}
.unit .un{font-weight:700;margin-bottom:.2rem}.unit .ico{margin-right:.2rem}
.unit .bar{height:15px;margin:.15rem 0}.unit .bar span{font-size:10.5px}
.eff{display:inline-block;font-size:10.5px;background:#efe2c6;border-radius:8px;padding:0 .35rem;margin:.1rem .1rem 0 0}
.eff.good{background:#d8ecd4}.eff.bad{background:#f2d0c8}
.cb-bottom{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:.6rem;flex:1}
.cb-actions,.cb-log{background:var(--card);border-radius:12px;padding:.7rem;max-height:46vh;overflow:auto}
.cb-log{font-size:13px;line-height:1.45}
.lg{padding:.08rem 0}.lg.big{font-weight:600}.lg.dim{color:var(--muted)}.lg.round{color:var(--accent2);font-weight:700}.lg hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}
.cb-turn .tt{font-size:13.5px;margin-bottom:.4rem}
.grp{border-top:1px dotted var(--line);padding:.35rem 0}.grp .gl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.techrow{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;margin:.2rem 0}.techrow>span:first-child{min-width:9.5rem;font-weight:600}.btn.stone{border-color:var(--gold);background:#fff7e0}
.spells .sp{border-top:1px dotted var(--line);padding:.35rem 0;font-size:13px}.spells .sp.dis{opacity:.5}
.cb-end{text-align:center}.cb-end h3{font-family:var(--serif);font-size:1.6rem;margin:.3rem}
@media (max-width:800px){.cb-field{grid-template-columns:1fr}.cb-bottom{grid-template-columns:1fr}.area{min-height:auto}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:var(--card);border-radius:14px;padding:1rem 1.3rem;max-width:460px;width:92vw;font-family:var(--sans)}
.mbox h3{margin-top:0;font-family:var(--serif);color:var(--accent2)}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(150%);background:var(--ink);color:#fff;font-family:var(--sans);font-size:14px;padding:.6rem 1rem;border-radius:10px;z-index:70;transition:transform .25s;max-width:90vw}
#toast.show{transform:translateX(-50%)}
</style>
</head>
<body data-view="start">
<header class="top">
  <span class="brand" onclick="party&&(view='book',render())">Duo Adventure <small>· SW 2.5</small></span>
  <nav class="nav">
    <button data-view="book">📖 Libro</button>
    <button data-view="intro">Cómo jugar</button>
    <button data-view="rules">Reglas</button>
    <button data-view="sheets">Fichas</button>
    <button data-view="bestiary">Bestiario</button>
    <button data-view="journal">Diario</button>
  </nav>
  <button id="sideToggle">👥 Grupo</button>
</header>
<div class="layout"><main id="main"></main><aside id="side"></aside></div>
<div id="combat"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="rules.js?v=1792796225"></script>
<script src="combat.js?v=1792796225"></script>
<script src="app.js?v=1792796225"></script>
<script src="loader.js?v=1792796225"></script>
</body>
</html>
